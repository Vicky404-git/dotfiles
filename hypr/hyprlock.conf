# ===========================================================================
# THE GRIMOIRE: HYPRLOCK CONFIGURATION
# ===========================================================================

background {
    monitor =
    # Grabs the current screen and blurs it heavily, exactly like your i3lock
    path = screenshot
    color = rgba(282828aa) # Transparent dark background fallback
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    # The Grimoire Palette
    outer_color = rgba(33ccffff)       # Cyan ring
    inner_color = rgba(141414ff)       # Dark center
    font_color = rgba(ebdbb2ff)        # Parchment text
    check_color = rgba(b8bb26ff)       # Moss Green (Verifying)
    fail_color = rgba(cc241dff)        # Crimson (Wrong password)

    fade_on_empty = false
    placeholder_text = <span font_family="JetBrainsMono Nerd Font"><i>Decrypting...</i></span>
    fail_text = <span font_family="JetBrainsMono Nerd Font"><i>Access Denied ($ATTEMPTS)</i></span>

    # Positioning matching your script offset
    position = 0, -120
    halign = center
    valign = center
}

# --- The Time ---
label {
    monitor =
    text = $TIME
    color = rgba(ebdbb2ff)             # Parchment text
    font_size = 65
    font_family = JetBrainsMono Nerd Font Bold
    
    position = 0, 80
    halign = center
    valign = center
}

# --- The Date ---
label {
    monitor =
    # Hyprlock uses shell commands to fetch formatted dates
    text = cmd[update:18000000] echo "$(date +'%A, %d %B')"
    color = rgba(ebdbb2ff)             # Parchment text
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    
    position = 0, 0
    halign = center
    valign = center
}
