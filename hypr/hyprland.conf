# ===========================================================================
# THE GRIMOIRE: HYPRLAND CONFIGURATION
# ===========================================================================

# --- Modifiers ---
$mainMod = SUPER

# --- Monitors ---
monitor=,preferred,auto,1

# --- Autostart (Daemons & UI) ---
exec-once = nm-applet &
exec-once = blueman-applet &
exec-once = dunst
exec-once = swaybg -i ~/dotfiles/wallpaper/wallhaven1.png -m fill

# Start DaemonV Background Observer
exec-once = bash -c "rm -f ~/.daemonv.lock; java -jar ~/.daemonv/daemonv.jar"

# System Monitor Dashboard (Opens btop on boot)
exec-once = kitty -T "SystemMonitor" btop --utf-force

# Drop-down Scratchpad Terminal (Hidden on boot)
exec-once = kitty --class scratchpad_term

# --- Visuals & Physics ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 0
    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)

    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# --- Window Rules (The Magic) ---
# Force SystemMonitor to Workspace 5 and remove borders
windowrulev2 = workspace 5, title:^(SystemMonitor)$
windowrulev2 = noborder, title:^(SystemMonitor)$

# The Drop-down Scratchpad Geometry
windowrulev2 = float, class:^(scratchpad_term)$
windowrulev2 = size 1000 650, class:^(scratchpad_term)$
windowrulev2 = center, class:^(scratchpad_term)$
windowrulev2 = workspace special:scratchpad, class:^(scratchpad_term)$

# --- Core Binds ---
bind = $mainMod, Return, exec, kitty
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod, V, togglefloating
bind = $mainMod, E, exec, kitty -e yazi
bind = , Print, exec, flameshot gui
bind = , Print, exec, QT_QPA_PLATFORM=wayland flameshot gui

# --- Focus Movement (Vim) ---
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# --- Move Focused Window ---
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# --- Tiling Modifiers ---
bind = $mainMod, B, togglesplit
bind = $mainMod SHIFT, V, togglesplit
bind = $mainMod, F, fullscreen

# --- Drop-down Terminal (Grave/Tilde key) ---
bind = $mainMod, grave, togglespecialworkspace, scratchpad

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# --- Utilities & Media ---
# Lock Screen (Using Hyprlock)
bind = $mainMod, X, exec, hyprlock

# Exit/Power Menu
bind = $mainMod SHIFT, E, exec, ~/.config/i3/powermenu.sh

# OBS Studio
bind = $mainMod, O, exec, obs

# Night Mode (wlsunset)
bind = $mainMod, N, exec, wlsunset -t 4500
bind = $mainMod SHIFT, N, exec, killall wlsunset

# Screenshots (Area selection)
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot_$(date +%F_%H-%M-%S).png

# Hardware Controls
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media Playback
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioStop, exec, playerctl stop
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next
